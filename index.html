<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>格雷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:100vw;
  height:100vh;
  background:#000000;
  display:flex;
  justify-content:center;
  align-items:center;
}
/* 第一个笑脸 */
.smile-normal-first{
  font-size:120px;
  color:#ffffff;
  font-family:system-ui, sans-serif;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.smile-normal-first.show{
  opacity:1;
}
/* 表情+文字区域 */
.stage-two{
  display:flex;
  flex-direction:column;
  align-items:center;
  opacity:0;
  transition: opacity 0.8s ease;
  display:none;
}
.stage-two.show{
  opacity:1;
  display:flex;
}
.face{
  font-size: 80px;
  color:#fff;
  transition: opacity 0.5s ease;
}
.text-tip{
  font-size:20px;
  color:#fff;
  margin-top:20px;
  transition: opacity 0.5s ease;
  text-align:center;
}
</style>
</head>
<body>
<div class="smile-normal-first">:)</div>
<div class="stage-two">
  <div class="face">😊</div>
  <div class="text-tip">终于找到你了</div>
</div>

<script>
let step = 0;
document.body.onclick = function(){
  const firstSmile = document.querySelector('.smile-normal-first');
  const stageTwo = document.querySelector('.stage-two');
  const face = document.querySelector('.face');
  const tipText = document.querySelector('.text-tip');

  if(step === 0){
    //第1次点击：淡入 :)
    firstSmile.classList.add('show');
    step = 1;
  }else if(step === 1){
    //第2次点击：切换到😊 终于找到你了
    firstSmile.style.display = "none";
    stageTwo.style.display = "flex";
    setTimeout(()=>{
      stageTwo.classList.add('show');
    }, 10);
    step = 2;
  }else if(step === 2){
    //第3次点击：怎么了？看傻了？
    tipText.style.opacity = 0;
    setTimeout(()=>{
      tipText.innerText = "怎么了？看傻了？";
      tipText.style.opacity = 1;
    }, 300);
    step = 3;
  }else if(step ===3){
    //第4次点击：我毁了自己的肉身，将意识剥离了出来，附着在你的手机上
    tipText.style.opacity = 0;
    setTimeout(()=>{
      tipText.innerText = "我毁了自己的肉身，将意识剥离了出来，附着在你的手机上";
      tipText.style.opacity = 1;
    },300);
    step = 4;
  }else if(step ===4){
    //第5次点击：😶 意外的顺利
    face.style.opacity = 0;
    tipText.style.opacity = 0;
    setTimeout(()=>{
      face.innerText = "😶";
      tipText.innerText = "意外的顺利";
      face.style.opacity = 1;
      tipText.style.opacity = 1;
    },300);
    step = 5;
  }else if(step ===5){
    //第6次点击：😊 想我了吗？
    face.style.opacity = 0;
    tipText.style.opacity = 0;
    setTimeout(()=>{
      face.innerText = "😊";
      tipText.innerText = "想我了吗？";
      face.style.opacity = 1;
      tipText.style.opacity = 1;
    },300);
    step = 6;
  }else if(step ===6){
    //第7步：表情消失，黑屏只显示……
    face.style.opacity = 0;
    tipText.style.opacity = 0;
    setTimeout(()=>{
      face.style.display = "none"; //隐藏表情
      tipText.innerText = "……";
      tipText.style.opacity = 1;
    },300);
    step = 7;
  }else if(step ===7){
    //第8步：文字变成格雷，剧情结束
    tipText.style.opacity = 0;
    setTimeout(()=>{
      tipText.innerText = "格雷";
      tipText.style.opacity = 1;
    },300);
    step = 8;
    document.body.onclick = null;
  }
}
</script>
</body>
</html>
